<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <title>Manage Activities - Kingdom Connects</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
  
  <style>
    .activities-grid {
      display: grid;
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .activity-card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      transition: all 0.2s ease;
    }
    .activity-card:hover {
      border-color: var(--gold);
    }
    .activity-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 1rem;
      gap: 1rem;
    }
    .activity-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }
    .activity-meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .activity-description {
      margin-bottom: 1rem;
      line-height: 1.6;
    }
    .activity-image {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 1rem;
    }
    .badge-recurring {
      background: rgba(33, 150, 243, 0.2);
      color: #2196f3;
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      overflow-y: auto;
    }
    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .modal-content {
      background: var(--card-bg);
      border: 2px solid var(--gold);
      border-radius: 8px;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .modal-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gold);
    }
    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 2rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
    .close-btn:hover {
      color: var(--gold);
    }
    .image-preview {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 4px;
      margin-top: 0.5rem;
    }
    .recurring-options {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      background: rgba(255,255,255,0.03);
      border-radius: 4px;
    }
    .recurring-options.active {
      display: block;
    }
  </style>
</head>

<body>
  <a id="top"></a>
  <div class="page-wrap">
    <div id="header"></div>
    <div id="breadcrumbs"></div>

    <main class="main-content">
      <div class="page-header">
        <h1 class="gold-metallic">Manage Church Activities</h1>
        <button class="action-button btn-gold" id="addActivityBtn">+ Add Activity</button>
      </div>

      <p class="text-muted">Create and manage church activities, events, Bible studies, and more. These will appear on your church page with social media sharing options.</p>

      <div id="activitiesList">
        <p class="status-message">Loading activities...</p>
      </div>
    </main>

    <div id="footer"></div>
  </div>

  <!-- Activity Modal -->
  <div id="activityModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Add Activity</h2>
        <button class="close-btn" id="closeModal">&times;</button>
      </div>

      <form id="activityForm">
        <input type="hidden" id="activityId">

        <div class="form-group">
          <label for="title">Activity Title *</label>
          <input type="text" id="title" class="input-dark" required placeholder="e.g., Women's Bible Study">
        </div>

        <div class="form-group">
          <label for="description">Description *</label>
          <textarea id="description" class="input-dark" rows="4" required placeholder="Describe your activity..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="date">Date *</label>
            <input type="date" id="date" class="input-dark" required>
          </div>
          <div class="form-group">
            <label for="time">Time *</label>
            <input type="time" id="time" class="input-dark" required>
          </div>
        </div>

        <div class="form-group">
          <label for="location">Location *</label>
          <input type="text" id="location" class="input-dark" required placeholder="At our church, online, or specific address">
        </div>

        <div class="form-group">
          <label for="contactInfo">Contact Info</label>
          <input type="text" id="contactInfo" class="input-dark" placeholder="Email or phone for questions">
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="isRecurring">
            This is a recurring activity
          </label>
        </div>

        <div id="recurringOptions" class="recurring-options">
          <div class="form-group">
            <label for="recurringPattern">Recurring Pattern</label>
            <select id="recurringPattern" class="input-dark">
              <option value="weekly">Weekly</option>
              <option value="biweekly">Every 2 Weeks</option>
              <option value="monthly">Monthly</option>
            </select>
          </div>
          <div class="form-group">
            <label for="recurringDescription">Pattern Description</label>
            <input type="text" id="recurringDescription" class="input-dark" placeholder="e.g., Every Wednesday at 7pm">
          </div>
        </div>

        <div class="form-group">
          <label for="activityImage">Activity Image</label>
          <input type="file" id="activityImage" class="input-dark" accept="image/*">
          <img id="imagePreview" class="image-preview" style="display:none;">
        </div>

        <div class="flex-gap">
          <button type="submit" class="action-button btn-gold">Save Activity</button>
          <button type="button" class="action-button btn-secondary" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/header.js" defer></script>
  <script src="js/footer.js" defer></script>
  <script src="js/church-auth-guard.js" defer></script>
  <script src="../js/breadcrumbs.js" defer></script>

  <script type="module">
    import { db, storage } from '../js/firebase-config.js';
    import { collection, addDoc, updateDoc, deleteDoc, doc, getDoc, query, where, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import { ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

    const auth = getAuth();
    let currentChurchId = null;
    let currentEditingId = null;
    let unsubscribe = null;

    const modal = document.getElementById('activityModal');
    const form = document.getElementById('activityForm');
    const activitiesList = document.getElementById('activitiesList');
    const isRecurringCheckbox = document.getElementById('isRecurring');
    const recurringOptions = document.getElementById('recurringOptions');
    const imageInput = document.getElementById('activityImage');
    const imagePreview = document.getElementById('imagePreview');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentChurchId = user.uid;
        loadActivities();
      }
    });

    function loadActivities() {
      const q = query(collection(db, 'church_activities'), where('church_id', '==', currentChurchId));
      
      unsubscribe = onSnapshot(q, (snapshot) => {
        const activities = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        
        if (activities.length === 0) {
          activitiesList.innerHTML = '<p class="status-message empty">No activities yet. Create your first one!</p>';
          return;
        }

        activitiesList.innerHTML = `<div class="activities-grid">${activities.map(activity => `
          <div class="activity-card">
            <div class="activity-header">
              <div>
                <div class="activity-title">${activity.title}</div>
                <div class="activity-meta">
                  <span>📅 ${formatDate(activity.date, activity.time)}</span>
                  <span>📍 ${activity.location}</span>
                  ${activity.is_recurring ? `<span class="badge-recurring">Recurring: ${activity.recurring_description || activity.recurring_pattern}</span>` : ''}
                </div>
              </div>
              <div class="flex-gap">
                <button class="action-button btn-secondary btn-sm" onclick="editActivity('${activity.id}')">Edit</button>
                <button class="action-button btn-danger btn-sm" onclick="deleteActivity('${activity.id}')">Delete</button>
              </div>
            </div>
            ${activity.image_url ? `<img src="${activity.image_url}" class="activity-image" alt="${activity.title}">` : ''}
            <div class="activity-description">${activity.description}</div>
            ${activity.contact_info ? `<p class="text-muted"><strong>Contact:</strong> ${activity.contact_info}</p>` : ''}
          </div>
        `).join('')}</div>`;
      });
    }

    function formatDate(dateStr, timeStr) {
      if (!dateStr) return 'TBA';
      const date = new Date(dateStr);
      const dateFormatted = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      return timeStr ? `${dateFormatted} at ${timeStr}` : dateFormatted;
    }

    document.getElementById('addActivityBtn').addEventListener('click', () => {
      currentEditingId = null;
      form.reset();
      imagePreview.style.display = 'none';
      document.getElementById('modalTitle').textContent = 'Add Activity';
      modal.classList.add('active');
    });

    document.getElementById('closeModal').addEventListener('click', () => {
      modal.classList.remove('active');
    });

    document.getElementById('cancelBtn').addEventListener('click', () => {
      modal.classList.remove('active');
    });

    isRecurringCheckbox.addEventListener('change', () => {
      if (isRecurringCheckbox.checked) {
        recurringOptions.classList.add('active');
      } else {
        recurringOptions.classList.remove('active');
      }
    });

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          imagePreview.src = e.target.result;
          imagePreview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';

      try {
        let imageUrl = null;
        
        if (imageInput.files[0]) {
          const file = imageInput.files[0];
          const storageRef = ref(storage, `churches/${currentChurchId}/activities/${Date.now()}_${file.name}`);
          await uploadBytes(storageRef, file);
          imageUrl = await getDownloadURL(storageRef);
        }

        const activityData = {
          church_id: currentChurchId,
          title: document.getElementById('title').value.trim(),
          description: document.getElementById('description').value.trim(),
          date: document.getElementById('date').value,
          time: document.getElementById('time').value,
          location: document.getElementById('location').value.trim(),
          contact_info: document.getElementById('contactInfo').value.trim(),
          is_recurring: isRecurringCheckbox.checked,
          recurring_pattern: isRecurringCheckbox.checked ? document.getElementById('recurringPattern').value : null,
          recurring_description: isRecurringCheckbox.checked ? document.getElementById('recurringDescription').value.trim() : null,
          updated_at: serverTimestamp()
        };

        if (imageUrl) {
          activityData.image_url = imageUrl;
        }

        if (currentEditingId) {
          await updateDoc(doc(db, 'church_activities', currentEditingId), activityData);
        } else {
          activityData.created_at = serverTimestamp();
          activityData.active = true;
          await addDoc(collection(db, 'church_activities'), activityData);
        }

        modal.classList.remove('active');
        form.reset();
        imagePreview.style.display = 'none';
        alert(currentEditingId ? 'Activity updated!' : 'Activity created!');
      } catch (error) {
        console.error('Error saving activity:', error);
        alert('Error saving activity. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save Activity';
      }
    });

    window.editActivity = async (activityId) => {
      currentEditingId = activityId;
      const docSnap = await getDoc(doc(db, 'church_activities', activityId));
      
      if (docSnap.exists()) {
        const data = docSnap.data();
        document.getElementById('activityId').value = activityId;
        document.getElementById('title').value = data.title || '';
        document.getElementById('description').value = data.description || '';
        document.getElementById('date').value = data.date || '';
        document.getElementById('time').value = data.time || '';
        document.getElementById('location').value = data.location || '';
        document.getElementById('contactInfo').value = data.contact_info || '';
        isRecurringCheckbox.checked = data.is_recurring || false;
        
        if (data.is_recurring) {
          recurringOptions.classList.add('active');
          document.getElementById('recurringPattern').value = data.recurring_pattern || 'weekly';
          document.getElementById('recurringDescription').value = data.recurring_description || '';
        }
        
        if (data.image_url) {
          imagePreview.src = data.image_url;
          imagePreview.style.display = 'block';
        }
        
        document.getElementById('modalTitle').textContent = 'Edit Activity';
        modal.classList.add('active');
      }
    };

    window.deleteActivity = async (activityId) => {
      if (confirm('Are you sure you want to delete this activity?')) {
        try {
          await deleteDoc(doc(db, 'church_activities', activityId));
          alert('Activity deleted!');
        } catch (error) {
          console.error('Error deleting activity:', error);
          alert('Error deleting activity. Please try again.');
        }
      }
    };

    window.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('active');
      }
    });
  </script>
</body>
</html>
