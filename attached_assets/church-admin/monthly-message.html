<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <title>Monthly Pastor Message - Kingdom Connects</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
  
  <style>
    .current-message {
      background: var(--card-bg);
      border: 2px solid var(--gold);
      border-radius: 8px;
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .message-header {
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--border-color);
    }
    .message-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }
    .message-date {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .message-content {
      font-size: 1.1rem;
      line-height: 1.8;
      color: var(--text-color);
      white-space: pre-wrap;
    }
    .message-history {
      margin-top: 3rem;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .history-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      transition: all 0.2s ease;
    }
    .history-card:hover {
      border-color: var(--gold);
    }
    .history-card-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 1rem;
    }
    .history-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--gold);
    }
    .history-excerpt {
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <a id="top"></a>
  <div class="page-wrap">
    <div id="header"></div>
    <div id="breadcrumbs"></div>

    <main class="main-content">
      <div class="page-header">
        <h1 class="gold-metallic">Monthly Pastor Message</h1>
        <button class="action-button btn-gold" id="newMessageBtn">+ New Message</button>
      </div>

      <p class="text-muted">Share a monthly message with your congregation and visitors. This message will be displayed prominently on your church page.</p>

      <div id="currentMessage">
        <p class="status-message">Loading...</p>
      </div>

      <div class="message-history">
        <div class="history-header">
          <h2>Previous Messages</h2>
        </div>
        <div id="historyList">
          <p class="status-message">Loading history...</p>
        </div>
      </div>
    </main>

    <div id="footer"></div>
  </div>

  <script src="js/header.js" defer></script>
  <script src="js/footer.js" defer></script>
  <script src="js/church-auth-guard.js" defer></script>
  <script src="../js/breadcrumbs.js" defer></script>

  <script type="module">
    import { db } from '../js/firebase-config.js';
    import { collection, addDoc, updateDoc, deleteDoc, doc, query, where, orderBy, limit, onSnapshot, serverTimestamp, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

    const auth = getAuth();
    let currentChurchId = null;
    let currentMessageData = null;

    const currentMessageDiv = document.getElementById('currentMessage');
    const historyList = document.getElementById('historyList');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentChurchId = user.uid;
        loadCurrentMessage();
        loadHistory();
      }
    });

    function loadCurrentMessage() {
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();
      
      const q = query(
        collection(db, 'church_messages'),
        where('church_id', '==', currentChurchId),
        where('month', '==', currentMonth),
        where('year', '==', currentYear),
        limit(1)
      );

      onSnapshot(q, (snapshot) => {
        if (snapshot.empty) {
          currentMessageDiv.innerHTML = `
            <div class="current-message">
              <p class="status-message empty">No message for ${getMonthName(currentMonth)} ${currentYear}. Create one to reach your congregation!</p>
            </div>
          `;
          currentMessageData = null;
        } else {
          const msgDoc = snapshot.docs[0];
          currentMessageData = { id: msgDoc.id, ...msgDoc.data() };
          
          currentMessageDiv.innerHTML = `
            <div class="current-message">
              <div class="message-header">
                <div class="message-title">${currentMessageData.title}</div>
                <div class="message-date">${getMonthName(currentMessageData.month)} ${currentMessageData.year}</div>
              </div>
              <div class="message-content">${currentMessageData.message}</div>
              <div class="flex-gap" style="margin-top: 1.5rem;">
                <button class="action-button btn-secondary" onclick="editMessage('${currentMessageData.id}')">Edit</button>
                <button class="action-button btn-danger" onclick="deleteMessage('${currentMessageData.id}')">Delete</button>
              </div>
            </div>
          `;
        }
      });
    }

    function loadHistory() {
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();

      const q = query(
        collection(db, 'church_messages'),
        where('church_id', '==', currentChurchId),
        orderBy('year', 'desc'),
        orderBy('month', 'desc')
      );

      onSnapshot(q, (snapshot) => {
        const messages = snapshot.docs
          .map(doc => ({ id: doc.id, ...doc.data() }))
          .filter(msg => !(msg.month === currentMonth && msg.year === currentYear));

        if (messages.length === 0) {
          historyList.innerHTML = '<p class="status-message empty">No previous messages.</p>';
          return;
        }

        historyList.innerHTML = messages.map(msg => `
          <div class="history-card">
            <div class="history-card-header">
              <div>
                <div class="history-title">${msg.title}</div>
                <div class="message-date">${getMonthName(msg.month)} ${msg.year}</div>
              </div>
              <div class="flex-gap">
                <button class="action-button btn-secondary btn-sm" onclick="viewMessage('${msg.id}')">View</button>
                <button class="action-button btn-danger btn-sm" onclick="deleteMessage('${msg.id}')">Delete</button>
              </div>
            </div>
            <div class="history-excerpt">${msg.message}</div>
          </div>
        `).join('');
      });
    }

    function getMonthName(monthIndex) {
      const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                      'July', 'August', 'September', 'October', 'November', 'December'];
      return months[monthIndex];
    }

    document.getElementById('newMessageBtn').addEventListener('click', () => {
      const now = new Date();
      const title = prompt('Message Title:');
      if (!title) return;
      
      const message = prompt('Your Message (Pastor\'s call to come in):');
      if (!message) return;

      createMessage(title, message, now.getMonth(), now.getFullYear());
    });

    async function createMessage(title, message, month, year) {
      try {
        await addDoc(collection(db, 'church_messages'), {
          church_id: currentChurchId,
          title: title.trim(),
          message: message.trim(),
          month: month,
          year: year,
          created_at: serverTimestamp(),
          active: true
        });
        alert('Message created!');
      } catch (error) {
        console.error('Error creating message:', error);
        alert('Error creating message. Please try again.');
      }
    }

    window.editMessage = async (messageId) => {
      const docSnap = await getDoc(doc(db, 'church_messages', messageId));
      if (!docSnap.exists()) return;
      
      const data = docSnap.data();
      const newTitle = prompt('Update Title:', data.title);
      if (newTitle === null) return;
      
      const newMessage = prompt('Update Message:', data.message);
      if (newMessage === null) return;

      try {
        await updateDoc(doc(db, 'church_messages', messageId), {
          title: newTitle.trim(),
          message: newMessage.trim(),
          updated_at: serverTimestamp()
        });
        alert('Message updated!');
      } catch (error) {
        console.error('Error updating message:', error);
        alert('Error updating message. Please try again.');
      }
    };

    window.viewMessage = async (messageId) => {
      const docSnap = await getDoc(doc(db, 'church_messages', messageId));
      if (!docSnap.exists()) return;
      
      const data = docSnap.data();
      alert(`${data.title}\n\n${data.message}`);
    };

    window.deleteMessage = async (messageId) => {
      if (confirm('Are you sure you want to delete this message?')) {
        try {
          await deleteDoc(doc(db, 'church_messages', messageId));
          alert('Message deleted!');
        } catch (error) {
          console.error('Error deleting message:', error);
          alert('Error deleting message. Please try again.');
        }
      }
    };
  </script>
</body>
</html>
