<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <title>Review Moderation - Kingdom Connects Admin</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">

  <style>
    .review-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      border-left: 4px solid #666;
    }
    .review-card.pending {
      border-left-color: #f4a261;
    }
    .review-card.approved {
      border-left-color: #50c878;
    }
    .review-card.flagged {
      border-left-color: #d32f2f;
    }
    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 1rem;
    }
    .review-meta {
      font-size: 0.9rem;
      color: #aaa;
    }
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-pending { background: #f4a261; color: white; }
    .status-approved { background: #50c878; color: white; }
    .status-flagged { background: #d32f2f; color: white; }
    .rating-stars {
      color: #ffd700;
      font-size: 1.2rem;
    }
    .action-buttons {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    .btn-small {
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
    }
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #333;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }
    .stat-label {
      color: #aaa;
      font-size: 0.9rem;
    }
    .admin-notes-section {
      background: rgba(255, 215, 0, 0.05);
      padding: 1rem;
      border-radius: 4px;
      margin-top: 1rem;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 8px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
  </style>
</head>

<body>
  <div class="page-wrap">
  <a id="top"></a>
  <div id="header"></div>

  <main class="main-content">
    <section class="page-content">
      <h2 class="gold-metallic">Review Moderation</h2>
      <p>Approve, flag, or remove business reviews. Manage reported content and maintain quality standards.</p>

      <div class="stat-cards">
        <div class="stat-card">
          <div class="stat-value" id="totalReviews">0</div>
          <div class="stat-label">Total Reviews</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="pendingCount">0</div>
          <div class="stat-label">Pending</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="approvedCount">0</div>
          <div class="stat-label">Approved</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="flaggedCount">0</div>
          <div class="stat-label">Flagged</div>
        </div>
      </div>

      <div class="flex-gap-center mb-md">
        <select id="filterStatus" class="input-dark" style="max-width: 200px;">
          <option value="">All Reviews</option>
          <option value="pending">Pending Only</option>
          <option value="approved">Approved Only</option>
          <option value="flagged">Flagged Only</option>
        </select>
        <select id="sortBy" class="input-dark" style="max-width: 200px;">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="rating-high">Highest Rating</option>
          <option value="rating-low">Lowest Rating</option>
        </select>
      </div>

      <div id="loading" class="text-center mt-lg">
        <p>Loading reviews...</p>
      </div>

      <div id="content" style="display: none;">
        <div id="reviewsList"></div>
      </div>

      <div id="empty" style="display: none;" class="text-center mt-lg">
        <p>No reviews found.</p>
      </div>

      <div id="error" style="display: none;" class="text-center mt-lg">
        <p style="color: #ff6b6b;">Error loading reviews. Please refresh the page.</p>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <!-- Add Admin Notes Modal -->
  <div id="notesModal" class="modal">
    <div class="modal-content">
      <h3 class="gold-metallic">Add Admin Notes</h3>
      <form id="notesForm">
        <div class="mb-md">
          <label class="block font-bold mb-sm">Internal Notes</label>
          <textarea id="adminNotesInput" class="textarea-dark" rows="6" maxlength="1000" placeholder="Why was this review flagged? Any context for other admins..."></textarea>
        </div>
        <div id="notesStatus" class="mb-md text-center"></div>
        <div class="flex-gap-center">
          <button type="submit" class="action-button btn-gold">Save Notes</button>
          <button type="button" id="btnCancelNotes" class="action-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/header.js" defer></script>
  <script src="js/footer.js" defer></script>

  <script type="module">
    import { db, auth } from "../js/firebase-config.js";
    import { collection, getDocs, updateDoc, deleteDoc, doc, query, orderBy, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { verifyAdminAccess } from "./js/admin-auth-guard.js";

    let currentUser = null;
    let allReviews = [];
    let currentReviewId = null;

    onAuthStateChanged(auth, async (user) => {
      const isAdmin = await verifyAdminAccess(user);
      if (!isAdmin) return;
      
      currentUser = user;
      await loadReviews();
    });

    document.getElementById('filterStatus').addEventListener('change', renderReviews);
    document.getElementById('sortBy').addEventListener('change', renderReviews);
    document.getElementById('btnCancelNotes').addEventListener('click', closeNotesModal);
    document.getElementById('notesForm').addEventListener('submit', saveAdminNotes);

    async function loadReviews() {
      try {
        const reviewsQuery = query(collection(db, "reviews"), orderBy("created_at", "desc"));
        const reviewsSnapshot = await getDocs(reviewsQuery);

        if (reviewsSnapshot.empty) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('empty').style.display = 'block';
          return;
        }

        const reviewPromises = reviewsSnapshot.docs.map(async (reviewDoc) => {
          const review = reviewDoc.data();
          const businessId = review.business_id;

          let businessName = 'Unknown Business';
          if (businessId) {
            try {
              const businessDoc = await getDoc(doc(db, "business_listings", businessId));
              if (businessDoc.exists()) {
                businessName = businessDoc.data().business_name;
              }
            } catch (e) {
              console.error('Error loading business:', e);
            }
          }

          return {
            id: reviewDoc.id,
            businessName,
            ...review
          };
        });

        allReviews = await Promise.all(reviewPromises);

        updateStats();
        renderReviews();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

      } catch (error) {
        console.error('Error loading reviews:', error);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
      }
    }

    function updateStats() {
      const totalReviews = allReviews.length;
      const pendingCount = allReviews.filter(r => (r.status || 'pending') === 'pending').length;
      const approvedCount = allReviews.filter(r => r.status === 'approved').length;
      const flaggedCount = allReviews.filter(r => r.status === 'flagged').length;

      document.getElementById('totalReviews').textContent = totalReviews;
      document.getElementById('pendingCount').textContent = pendingCount;
      document.getElementById('approvedCount').textContent = approvedCount;
      document.getElementById('flaggedCount').textContent = flaggedCount;
    }

    function renderReviews() {
      const filterStatus = document.getElementById('filterStatus').value;
      const sortBy = document.getElementById('sortBy').value;
      
      let filtered = [...allReviews];

      if (filterStatus) {
        filtered = filtered.filter(r => (r.status || 'pending') === filterStatus);
      }

      filtered.sort((a, b) => {
        if (sortBy === 'newest') {
          return (b.created_at?.toDate() || new Date(0)) - (a.created_at?.toDate() || new Date(0));
        } else if (sortBy === 'oldest') {
          return (a.created_at?.toDate() || new Date(0)) - (b.created_at?.toDate() || new Date(0));
        } else if (sortBy === 'rating-high') {
          return (b.rating || 0) - (a.rating || 0);
        } else if (sortBy === 'rating-low') {
          return (a.rating || 0) - (b.rating || 0);
        }
        return 0;
      });

      const container = document.getElementById('reviewsList');
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #aaa; padding: 2rem;">No reviews match the selected filter</p>';
        return;
      }

      filtered.forEach(review => {
        const card = document.createElement('div');
        card.className = `review-card ${review.status || 'pending'}`;

        const statusClass = `status-${review.status || 'pending'}`;
        const createdDate = review.created_at?.toDate ? review.created_at.toDate().toLocaleString() : 'Unknown';
        const moderatedDate = review.moderated_at?.toDate ? review.moderated_at.toDate().toLocaleString() : '';
        const stars = '⭐'.repeat(review.rating || 0);

        let adminNotesHTML = '';
        if (review.admin_notes) {
          adminNotesHTML = `
            <div class="admin-notes-section">
              <strong>Admin Notes:</strong> ${escapeHtml(review.admin_notes)}
              ${review.moderated_by ? `<br><small>By: ${escapeHtml(review.moderated_by)} on ${moderatedDate}</small>` : ''}
            </div>
          `;
        }

        let responseHTML = '';
        if (review.response_text) {
          const responseDate = review.response_date?.toDate ? review.response_date.toDate().toLocaleString() : '';
          responseHTML = `
            <div style="background: rgba(212, 175, 55, 0.05); padding: 1rem; border-radius: 4px; margin-top: 1rem;">
              <strong>Business Response:</strong> ${escapeHtml(review.response_text)}
              ${responseDate ? `<br><small>${responseDate}</small>` : ''}
            </div>
          `;
        }

        card.innerHTML = `
          <div class="review-header">
            <div>
              <div class="rating-stars">${stars}</div>
              <div class="review-meta">
                <strong>Business:</strong> ${escapeHtml(review.businessName)}<br>
                <strong>Reviewer:</strong> ${escapeHtml(review.reviewer_name || 'Anonymous')}<br>
                <strong>Submitted:</strong> ${createdDate}
              </div>
            </div>
            <span class="status-badge ${statusClass}">${review.status || 'pending'}</span>
          </div>
          <div style="margin-bottom: 1rem;">
            <strong>Review:</strong><br>
            ${escapeHtml(review.review_text || 'No text provided')}
          </div>
          ${responseHTML}
          ${adminNotesHTML}
          <div class="action-buttons">
            <button class="action-button btn-small" style="background: #50c878;" onclick="window.approveReview('${review.id}')">✓ Approve</button>
            <button class="action-button btn-small" style="background: #f4a261;" onclick="window.flagReview('${review.id}')">⚠ Flag</button>
            <button class="action-button btn-small" style="background: #4a90e2;" onclick="window.addNotes('${review.id}')">📝 Add Notes</button>
            <button class="action-button btn-small" style="background: #d32f2f;" onclick="window.deleteReview('${review.id}')">🗑 Delete</button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    window.approveReview = async function(reviewId) {
      if (!confirm('Approve this review and make it visible to the public?')) return;

      try {
        await updateDoc(doc(db, "reviews", reviewId), {
          status: 'approved',
          moderated_by: currentUser.email,
          moderated_at: serverTimestamp()
        });
        alert('Review approved successfully');
        await loadReviews();
      } catch (error) {
        console.error('Error approving review:', error);
        alert('Error approving review: ' + error.message);
      }
    };

    window.flagReview = async function(reviewId) {
      const reason = prompt('Why are you flagging this review? (Optional)');
      
      try {
        const updateData = {
          status: 'flagged',
          moderated_by: currentUser.email,
          moderated_at: serverTimestamp()
        };
        
        if (reason) {
          updateData.admin_notes = reason;
        }

        await updateDoc(doc(db, "reviews", reviewId), updateData);
        alert('Review flagged successfully');
        await loadReviews();
      } catch (error) {
        console.error('Error flagging review:', error);
        alert('Error flagging review: ' + error.message);
      }
    };

    window.addNotes = function(reviewId) {
      currentReviewId = reviewId;
      const review = allReviews.find(r => r.id === reviewId);
      document.getElementById('adminNotesInput').value = review?.admin_notes || '';
      document.getElementById('notesStatus').textContent = '';
      document.getElementById('notesModal').style.display = 'flex';
    };

    window.deleteReview = async function(reviewId) {
      if (!confirm('PERMANENTLY DELETE this review? This cannot be undone.')) return;

      try {
        await deleteDoc(doc(db, "reviews", reviewId));
        alert('Review deleted successfully');
        await loadReviews();
      } catch (error) {
        console.error('Error deleting review:', error);
        alert('Error deleting review: ' + error.message);
      }
    };

    function closeNotesModal() {
      document.getElementById('notesModal').style.display = 'none';
      currentReviewId = null;
    }

    async function saveAdminNotes(e) {
      e.preventDefault();

      if (!currentReviewId) return;

      const statusDiv = document.getElementById('notesStatus');
      statusDiv.style.color = '#ccc';
      statusDiv.textContent = 'Saving...';

      const notes = document.getElementById('adminNotesInput').value.trim();

      try {
        await updateDoc(doc(db, "reviews", currentReviewId), {
          admin_notes: notes || null,
          moderated_by: currentUser.email,
          moderated_at: serverTimestamp()
        });

        statusDiv.style.color = '#50c878';
        statusDiv.textContent = 'Notes saved successfully!';

        setTimeout(() => {
          closeNotesModal();
          loadReviews();
        }, 1000);

      } catch (error) {
        console.error('Error saving notes:', error);
        statusDiv.style.color = '#ff6b6b';
        statusDiv.textContent = 'Error: ' + error.message;
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    window.addEventListener('click', (e) => {
      if (e.target.id === 'notesModal') {
        closeNotesModal();
      }
    });
  </script>
  </div>
</body>
</html>
