<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="var(--theme-background)">
  <title>{{site.title}}</title>
  <meta name="description" content="{{site.description}}">
  <link rel="stylesheet" href="master.css">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="buttons.css">
  <link rel="stylesheet" href="forms.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="site.css">
  {{head.icons}}
</head>
<body class="stage">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div data-component="site-header">{{component.header}}</div>
  <main id="main-content" class="main">
    <div class="main-inner" data-slot="page-content">{{page.content}}</div>
  </main>
  <div data-component="site-footer">{{component.footer}}</div>
</body>
</html>
