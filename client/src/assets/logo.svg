<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 85">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8d4ff"/>
      <stop offset="1" stop-color="#60b8ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- QR - equal sized Q and R -->
  <g transform="translate(8, 6)" filter="url(#glow)">
    <!-- Q: Outer rounded square -->
    <rect x="0" y="0" width="44" height="44" rx="7" fill="none" stroke="url(#steel)" stroke-width="4.5"/>
    <!-- Q tail -->
    <path d="M34 34 L48 48" fill="none" stroke="url(#steel)" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Finder patterns inside Q -->
    <rect x="10" y="10" width="9" height="9" rx="1.5" fill="none" stroke="url(#steel)" stroke-width="1.5"/>
    <rect x="25" y="10" width="9" height="9" rx="1.5" fill="none" stroke="url(#steel)" stroke-width="1.5"/>
    <rect x="10" y="25" width="9" height="9" rx="1.5" fill="none" stroke="url(#steel)" stroke-width="1.5"/>
    <!-- Center fills -->
    <rect x="12.5" y="12.5" width="4" height="4" rx="1" fill="url(#steel)"/>
    <rect x="27.5" y="12.5" width="4" height="4" rx="1" fill="url(#steel)"/>
    <rect x="12.5" y="27.5" width="4" height="4" rx="1" fill="url(#steel)"/>
    <circle cx="29.5" cy="29.5" r="2" fill="url(#steel)"/>
  </g>

  <!-- R: Same height as Q (44px), positioned right after Q -->
  <g transform="translate(68, 6)" fill="none" stroke="url(#steel)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M0 0 L0 44" stroke-width="4.5"/>
    <path d="M0 0 L28 0 Q40 0 40 11 Q40 22 28 22 L0 22" stroke-width="4.5"/>
    <path d="M20 22 L44 48" stroke-width="4.5"/>
  </g>

  <!-- Divider line - aligned with Q left edge to R right edge -->
  <line x1="8" y1="58" x2="112" y2="58" stroke="url(#steel)" stroke-width="0.8" opacity="0.5"/>

  <!-- GEAR - stretched to align exactly with Q left to R right (8 to 112) -->
  <text x="8" y="76" font-size="16" font-weight="300" letter-spacing="20" fill="url(#steel)"
        font-family="'Orbitron', 'Eurostile', 'Bank Gothic', system-ui, sans-serif">GEAR</text>
</svg>