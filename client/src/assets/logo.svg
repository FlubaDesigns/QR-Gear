<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f1ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#b9d0ff" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- QR Code Q shape -->
  <g transform="translate(10, 5)" filter="url(#glow)">
    <!-- Outer rounded square -->
    <rect x="0" y="0" width="50" height="50" rx="8" ry="8" fill="none" stroke="url(#steel)" stroke-width="5"/>
    <!-- Q tail -->
    <path d="M38 38 L50 50" fill="none" stroke="url(#steel)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Finder patterns -->
    <g transform="translate(12, 12)" fill="none" stroke="url(#steel)" stroke-width="1.8">
      <rect x="0" y="0" width="8" height="8" rx="1"/>
      <rect x="18" y="0" width="8" height="8" rx="1"/>
      <rect x="0" y="18" width="8" height="8" rx="1"/>
      <!-- Center dots -->
      <rect x="2.5" y="2.5" width="3" height="3" rx="0.5" fill="url(#steel)" stroke="none"/>
      <rect x="20.5" y="2.5" width="3" height="3" rx="0.5" fill="url(#steel)" stroke="none"/>
      <rect x="2.5" y="20.5" width="3" height="3" rx="0.5" fill="url(#steel)" stroke="none"/>
      <circle cx="20" cy="20" r="1.5" fill="url(#steel)" stroke="none"/>
    </g>
  </g>

  <!-- R Letter -->
  <g transform="translate(68, 5)" fill="none" stroke="url(#steel)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M0 0 L0 50" stroke-width="5"/>
    <path d="M0 0 L24 0 Q34 0 34 12 Q34 24 24 24 L0 24" stroke-width="5"/>
    <path d="M0 24 L34 50" stroke-width="5"/>
  </g>

  <!-- GEAR text stretched underneath -->
  <g transform="translate(10, 68)" fill="url(#steel)">
    <text x="0" y="22" font-size="22" font-weight="400" letter-spacing="16"
          font-family="Eurostile, 'Bank Gothic', 'Orbitron', system-ui, sans-serif" opacity="0.95">GEAR</text>
  </g>
  
  <!-- Subtle divider line -->
  <line x1="10" y1="62" x2="98" y2="62" stroke="url(#steel)" stroke-width="0.5" opacity="0.4"/>
</svg>