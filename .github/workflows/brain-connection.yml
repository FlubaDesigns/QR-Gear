name: Verify Brain connection
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix functions ci --no-audit --no-fund
      - run: npm run check
      - run: npm --prefix functions run build
      - run: node --import tsx --test tests/brain-connection.test.ts
      - run: npx vitest run src/services/__tests__/admin-access.test.ts src/services/__tests__/authorization-engine-auth.test.ts
        working-directory: functions
