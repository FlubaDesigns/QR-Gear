<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 1700 1700">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f1ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#b9d0ff" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(100,100)">
    <rect x="0" y="0" width="1350" height="1350" rx="180" ry="180" fill="none" stroke="url(#steel)" stroke-width="140" filter="url(#glow)"/>
    <path d="M1040 1040 L1350 1350" fill="none" stroke="url(#steel)" stroke-width="140" stroke-linecap="round" filter="url(#glow)"/>

    <g transform="translate(330,330)" fill="none" stroke="url(#steel)" stroke-width="46">
      <rect x="0" y="0" width="220" height="220" rx="24"/>
      <rect x="470" y="0" width="220" height="220" rx="24"/>
      <rect x="0" y="470" width="220" height="220" rx="24"/>
      <rect x="70" y="70" width="80" height="80" rx="18" fill="url(#steel)" stroke="none"/>
      <rect x="540" y="70" width="80" height="80" rx="18" fill="url(#steel)" stroke="none"/>
      <rect x="70" y="540" width="80" height="80" rx="18" fill="url(#steel)" stroke="none"/>
      <circle cx="520" cy="520" r="44" fill="url(#steel)" stroke="none"/>
      <rect x="360" y="340" width="90" height="90" rx="18" fill="url(#steel)" stroke="none"/>
      <rect x="650" y="520" width="90" height="90" rx="18" fill="url(#steel)" stroke="none"/>
    </g>
  </g>
</svg>